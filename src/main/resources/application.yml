spring:
  application:
    name: logistics-platform
  config:
    # Локальные секреты из .env (образец: .env.example). Переменные окружения важнее
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/logistics
    username: logistics
    password: logistics
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Открытые ключи Keycloak: ими проверяется подпись токена. Скачиваются при первом запросе
          jwk-set-uri: ${keycloak.url}/realms/${keycloak.realm}/protocol/openid-connect/certs
          # Ожидаемый iss в токене. Это адрес, который видит браузер, поэтому он не зависит от KEYCLOAK_URL
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/citylogistics}

  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # По умолчанию send() ждёт брокер 60 с, держа запрос и блокировку строки
        max.block.ms: 5000
    consumer:
      group-id: logistics-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Битое сообщение логируется и пропускается, а не блокирует консьюмер
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.kopach.logistics.*"

server:
  port: 8080

# Повтор назначения для заказов, которые долго без водителя (UnassignedOrderRetryScheduler)
orders:
  assignment-retry:
    enabled: true
    # Формат ISO-8601 (PT30S = 30 секунд): @Scheduled не понимает запись вида 30s
    interval: PT30S # как часто проверять
    min-age: 30s    # сколько заказ должен пролежать в NEW, чтобы его повторить

# Transactional Outbox: события сначала пишутся в outbox_events, OutboxRelay отправляет их в Kafka
outbox:
  relay:
    interval: PT1S      # как часто отправлять (ISO-8601: @Scheduled не понимает 1s)
    initial-delay: PT5S
    batch-size: 100     # сколько событий за один запуск
    send-timeout: 10s   # сколько ждать подтверждения Kafka
  retention: 7d         # сколько хранить отправленные события
  cleanup-cron: "0 0 * * * *"  # удаление старых — раз в час

management:
  endpoints:
    web:
      exposure:
        # Наружу только health: остальные эндпоинты Actuator раскрывают конфигурацию
        include: health
  endpoint:
    health:
      # Только UP/DOWN, без деталей о БД и диске
      show-details: never

# Keycloak. KEYCLOAK_URL — адрес, по которому core сам ходит в Keycloak:
# из IDE это localhost:8180, из Docker — keycloak:8080 (задаётся в docker-compose.yml)
keycloak:
  url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: citylogistics
  # Служебный клиент core для Admin API (создание пользователей при регистрации)
  client-id: citylogistics-core
  # Из .env или переменной окружения, в git не хранится
  client-secret: ${KEYCLOAK_CORE_CLIENT_SECRET}

logging:
  level:
    com.kopach.logistics: DEBUG
    org.springframework.kafka: INFO
    org.springframework.security: INFO

services:
  driver-service:
    url: http://localhost:8082
    # Общий ключ с driver-service, в git не хранится
    api-key: ${INTERNAL_API_KEY}
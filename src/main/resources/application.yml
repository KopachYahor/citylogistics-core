spring:
  application:
    name: logistics-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/logistics
    username: logistics
    password: logistics
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: logistics-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Обёртка над JsonDeserializer: если сообщение не разбирается (битый JSON),
      # оно логируется и пропускается. Без неё консьюмер бесконечно спотыкается
      # на этом сообщении, и все следующие события перестают обрабатываться.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.kopach.logistics.*"

server:
  port: 8080

jwt:
  # Секрет НЕ хранится в git. Задаётся переменной окружения JWT_SECRET
  # (base64-строка, минимум 32 байта). Без неё приложение не стартует.
  secret: ${JWT_SECRET}
  expiration: 86400000

logging:
  level:
    com.kopach.logistics: DEBUG
    org.springframework.kafka: INFO
    org.springframework.security: INFO

# Адрес driver-service для REST-вызова при регистрации водителя (DriverServiceClient)
services:
  driver-service:
    url: http://localhost:8082
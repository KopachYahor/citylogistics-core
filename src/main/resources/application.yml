spring:
  application:
    name: logistics-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/logistics
    username: logistics
    password: logistics
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: logistics-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.kopach.logistics.*"

server:
  port: 8080

jwt:
  secret: bXktc3VwZXItc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctbWluLTMyLWJ5dGVzLWxvbmc
  expiration: 86400000

logging:
  level:
    com.kopach.logistics: DEBUG
    org.springframework.kafka: INFO
    org.springframework.security: INFO

app:
  cors:
    allowed-origins: http://localhost:5500,http://127.0.0.1:5500
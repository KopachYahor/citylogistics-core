# Ключи только для тестов, нигде больше не используются
# Keycloak в тестах не вызывается: KeycloakAdminClient и JwtDecoder подменяются моками
keycloak.client-secret=test-keycloak-secret
services.driver-service.api-key=test-internal-key

# Kafka в тестах не нужна, поэтому и повтор назначения выключен
orders.assignment-retry.enabled=false
# OutboxRelay в тестах сам не запускается: тесты вызывают его напрямую
outbox.relay.initial-delay=P1D
outbox.cleanup-cron=-
spring.kafka.listener.auto-startup=false

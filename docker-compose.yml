# Весь проект одной командой: docker compose up --build
# Только инфраструктура (сервисы запускаются из IDE):
#   docker compose up -d postgres postgres-drivers kafka kafka-ui keycloak
# Секреты (INTERNAL_API_KEY, KEYCLOAK_CORE_CLIENT_SECRET, KEYCLOAK_ADMIN_PASSWORD)
# Compose берёт из файла .env рядом с этим файлом.

services:
  postgres:
    image: postgres:15
    container_name: logistics-postgres
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # healthy = база принимает подключения. По этому статусу ждёт core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-drivers:
    image: postgres:15
    container_name: logistics-postgres-drivers
    environment:
      POSTGRES_DB: drivers
      POSTGRES_USER: drivers
      POSTGRES_PASSWORD: drivers
    ports:
      - "5433:5432"
    volumes:
      - drivers_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivers -d drivers"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: logistics-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 9092 — для контейнеров (kafka:9092), 29092 — для приложений на хосте (localhost:29092)
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    # healthy = брокер отвечает на запрос версий API
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: logistics-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    container_name: logistics-keycloak
    # start-dev: режим разработки (HTTP, встроенная база H2). --import-realm: при первом старте
    # создать realm из keycloak/realm-export.json, если его ещё нет
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Адрес, который видит браузер. Он попадает в токены (поле iss), даже если запрос
      # пришёл изнутри Docker на keycloak:8080, поэтому core проверяет один и тот же iss
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Подставляется в realm-export.json вместо ${KEYCLOAK_CORE_CLIENT_SECRET}
      KEYCLOAK_CORE_CLIENT_SECRET: ${KEYCLOAK_CORE_CLIENT_SECRET}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    # В образе нет curl: спрашиваем /health/ready на служебном порту 9000 средствами bash
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  core:
    build: .
    container_name: logistics-core
    ports:
      - "8080:8080"
    # Внутри контейнера localhost — это сам контейнер, поэтому адреса другие, чем в application.yml.
    # Переменные окружения важнее application.yml: SPRING_DATASOURCE_URL заменяет spring.datasource.url
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logistics
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICES_DRIVER_SERVICE_URL: http://driver-service:8082
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # Ключи для проверки токенов и Admin API берём по внутреннему адресу Keycloak.
      # iss в токенах остаётся http://localhost:8180/... (см. KC_HOSTNAME)
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_CORE_CLIENT_SECRET: ${KEYCLOAK_CORE_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  driver-service:
    # Репозиторий driver-service должен лежать рядом: ../citylogistics-driver-service
    build: ../citylogistics-driver-service
    container_name: logistics-driver-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-drivers:5432/drivers
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Тот же ключ, что у core: оба берут его из одного .env
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      postgres-drivers:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
  drivers_data:
  keycloak_data:
